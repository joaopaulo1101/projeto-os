services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: projeto-os-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "8001:8000"
      - "5173:5173"
    environment:
      APP_NAME: Projeto OS
      APP_ENV: local
      APP_URL: http://localhost:8001
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: projeto_os
      DB_USERNAME: projeto_os
      DB_PASSWORD: projeto_os
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/usr/local/bin/start-development"]

  postgres:
    image: postgres:17-alpine
    container_name: projeto-os-postgres
    environment:
      POSTGRES_DB: projeto_os
      POSTGRES_USER: projeto_os
      POSTGRES_PASSWORD: projeto_os
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U projeto_os -d projeto_os" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  node_modules:
