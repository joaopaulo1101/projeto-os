services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: projeto-os-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: projeto-os-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: projeto-os-postgres
    environment:
      POSTGRES_DB: projeto_os
      POSTGRES_USER: projeto_os
      POSTGRES_PASSWORD: projeto_os
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projeto_os -d projeto_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
